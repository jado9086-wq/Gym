<title>Plate Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;450;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0E141B; --panel:#18212C; --panel2:#1F2A37; --raise:#26333F; --line:#2C3B4C;
  --mute:#6E829A; --text:#CBD7E4; --bright:#E8EFF6;
  --steel:#79A6D2; --steel-dim:#3C6A93; --brass:#D8A657; --r:8px;
  --sans:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --disp:"Archivo","IBM Plex Sans",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --top:env(safe-area-inset-top);
  --bot:env(safe-area-inset-bottom);
  --dock:calc(58px + var(--bot));
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
html,body{margin:0;padding:0;overscroll-behavior-y:none}
body{
  background:var(--ink);color:var(--text);font-family:var(--sans);font-size:16px;line-height:1.45;
  -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
  touch-action:manipulation;
  padding-bottom:calc(var(--dock) + 16px);
}
body.has-bar{padding-bottom:calc(var(--dock) + 74px)}
button,input,select{font-family:inherit;font-size:16px;color:inherit}
button{cursor:pointer;border:none;background:none;-webkit-user-select:none;user-select:none;touch-action:manipulation}
:focus-visible{outline:2px solid var(--steel);outline-offset:2px;border-radius:3px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* ---------------------------------------------------------- top bar */
.topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:10px;
  height:calc(46px + var(--top));padding:0 16px;padding-top:var(--top);
  background:rgba(14,20,27,.94);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.brand{font-family:var(--disp);font-weight:800;font-size:13px;letter-spacing:.16em;color:var(--bright);
  display:flex;align-items:center;gap:9px}
.brand i{display:block;width:20px;height:9px;border-radius:2px;
  background:linear-gradient(90deg,var(--steel-dim) 0 4px,transparent 4px 6px,var(--steel) 6px 14px,transparent 14px 16px,var(--steel-dim) 16px 20px)}
#syncdot{width:8px;height:8px;border-radius:50%;background:var(--mute);margin-left:auto}
#syncdot[data-s="ok"]{background:var(--steel)}
#syncdot[data-s="busy"]{background:var(--brass)}
#syncdot[data-s="off"]{background:#3B4A5A}
#syncdot[data-s="wait"]{background:var(--brass)}
#syncdot[data-s="local"]{background:var(--mute)}

main{max-width:760px;margin:0 auto;padding:18px 14px 24px}
.eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--mute)}
h1{font-family:var(--disp);font-size:26px;font-weight:700;letter-spacing:-.02em;color:var(--bright);margin:3px 0 0}
h2{font-family:var(--disp);font-size:17px;font-weight:600;color:var(--bright);margin:0}
.head{margin-bottom:16px}
.head .row{margin-top:12px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.grow{flex:1}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px}
.pad{padding:16px}
.stack{display:flex;flex-direction:column;gap:12px}

.btn{min-height:44px;padding:0 16px;border-radius:var(--r);background:var(--panel2);border:1px solid var(--line);
  color:var(--text);font-weight:500;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:active{background:var(--raise)}
.btn.primary{background:var(--steel);border-color:var(--steel);color:#0B1218;font-weight:600}
.btn.primary:active{background:#8FB6DC}
.btn.ghost{background:transparent}
.btn.sm{min-height:38px;padding:0 12px;font-size:14px}
.btn.wide{width:100%}
.btn.danger{color:#D98D8D}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(84px,1fr));gap:1px;background:var(--line);
  border:1px solid var(--line);border-radius:12px;overflow:hidden}
.stat{background:var(--panel);padding:11px 12px}
.stat b{display:block;font-family:var(--mono);font-size:20px;font-weight:500;color:var(--bright);letter-spacing:-.02em}
.stat b small{font-size:12px;color:var(--mute);font-weight:400;margin-left:2px}
.stat span{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);margin-top:3px}

/* ------------------------------------------------- exercise + sets */
.exblock{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.exhead{display:flex;align-items:center;gap:9px;padding:12px 14px;border-bottom:1px solid var(--line);background:var(--panel2)}
.exhead .idx{font-family:var(--mono);font-size:11px;color:var(--steel-dim)}
.exhead .nm{font-family:var(--disp);font-weight:600;font-size:16px;color:var(--bright);line-height:1.2;
  min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.exhead .tag{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);
  border:1px solid var(--line);padding:2px 6px;border-radius:20px}
.exhead .exvol{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--mute);flex-shrink:0}

.gridhead{display:grid;grid-template-columns:1fr 1fr 48px;gap:6px;padding:6px 12px 0;
  font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.gridhead span{text-align:center}

.setrow{display:grid;grid-template-columns:1fr 1fr 48px;grid-template-areas:"kg reps tick" "meta meta tick";
  gap:5px 6px;padding:8px 12px;border-bottom:1px solid rgba(44,59,76,.55);align-items:center}
.setrow:last-of-type{border-bottom:none}
.setrow.done{background:rgba(121,166,210,.06)}
.setrow.pb{background:rgba(216,166,87,.10)}
.setmeta{grid-area:meta;display:flex;align-items:baseline;gap:7px;min-width:0}
.setno{font-family:var(--mono);font-size:11.5px;color:var(--mute);flex-shrink:0}
.setrow.done .setno{color:var(--steel)}
.setrow.pb .setno{color:var(--brass)}
.stepper{display:grid;grid-template-columns:38px minmax(0,1fr) 38px;height:46px;
  border:1px solid var(--line);border-radius:10px;background:var(--ink);overflow:hidden;align-items:stretch}
.stepper.kg{grid-area:kg} .stepper.reps{grid-area:reps}
.stepper button{font-size:20px;font-weight:500;color:var(--steel);line-height:1;padding:0}
.stepper button:active{background:var(--panel2)}
.stepper .num{border:none;background:transparent;height:100%;width:100%;text-align:center;
  font-family:var(--mono);font-size:17px;font-variant-numeric:tabular-nums;color:var(--bright);padding:0;min-width:0}
.stepper .num::placeholder{color:#41525F}
.stepper .num:focus{outline:none;background:rgba(121,166,210,.08)}
.setrow.done .stepper{border-color:var(--steel-dim)}
.setrow.pb .stepper{border-color:rgba(216,166,87,.5)}
.ghost{font-family:var(--mono);font-size:11px;color:#54677B;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ghost.beat{color:var(--brass)}
.tick{grid-area:tick;height:46px;width:48px;border-radius:10px;border:1px solid var(--line);background:var(--ink);
  color:#3E4E5F;font-size:19px;display:flex;align-items:center;justify-content:center}
.tick[aria-pressed="true"]{background:var(--steel);border-color:var(--steel);color:#0B1218}
.setrow.pb .tick[aria-pressed="true"]{background:var(--brass);border-color:var(--brass)}
.exfoot{display:flex;gap:6px;padding:10px 12px;border-top:1px solid var(--line);flex-wrap:wrap}
.del{color:#4A5C6E;font-size:19px;padding:6px 4px;min-width:34px}

.item{display:flex;align-items:center;gap:12px;padding:13px 14px;border-bottom:1px solid var(--line);min-height:56px}
.item:last-child{border-bottom:none}
.item .nm{font-weight:500;color:var(--bright);font-size:15.5px}
.item .sub{font-family:var(--mono);font-size:11.5px;color:var(--mute);margin-top:2px}

<body>

<header class="topbar">
  <div class="brand"><i></i>PLATE LEDGER</div>
  <span id="syncdot" data-s="off" title="Backup status"></span>
</header>

<main id="view"></main>

<div id="dock">
  <div id="livebar-slot"></div>
  <nav class="tabs" id="tabs">
    <button data-view="train"><b></b>Train</button>
    <button data-view="plans"><b></b>Plans</button>
    <button data-view="progress"><b></b>Progress</button>
    <button data-view="library"><b></b>More</button>
  </nav>
</div>

<div id="modal-root"></div>
<div id="toast"></div>

<script>
'use strict';

/* ======================================================================
   local cache
   ====================================================================== */
const LKEY = 'plateledger:v2';
const TKEY = 'plateledger:token';
const RKEY = 'plateledger:rest';

const LOCAL = (()=>{
  try{ localStorage.setItem(LKEY+':probe','1'); localStorage.removeItem(LKEY+':probe'); return localStorage; }
  catch(e){ const m={}; return { getItem:k=>k in m?m[k]:null, setItem:(k,v)=>{m[k]=String(v)}, removeItem:k=>{delete m[k]} }; }
})();

/* ======================================================================
   seed data
   ====================================================================== */
const SEED = [
  ['Back squat','Legs',2.5],['Front squat','Legs',2.5],['Romanian deadlift','Hinge',2.5],['Deadlift','Hinge',5],
  ['Hip thrust','Hinge',5],['Leg press','Legs',5],['Walking lunge','Legs',2],['Leg curl','Legs',5],
  ['Leg extension','Legs',5],['Calf raise','Legs',5],
  ['Bench press','Push',2.5],['Incline dumbbell press','Push',2],['Overhead press','Push',2.5],
  ['Dumbbell shoulder press','Push',2],['Cable fly','Push',2.5],['Dip','Push',2.5],
  ['Triceps pushdown','Push',2.5],['Lateral raise','Push',1],
  ['Pull-up','Pull',2.5],['Lat pulldown','Pull',5],['Barbell row','Pull',2.5],['Seated cable row','Pull',5],
  ['Chest-supported row','Pull',2],['Face pull','Pull',2.5],['Barbell curl','Pull',1.25],['Hammer curl','Pull',2],
  ['Plank','Core',2.5],['Hanging leg raise','Core',2.5],['Cable crunch','Core',2.5],['Back extension','Core',2.5]
];
const TEMPLATES = {
  'Lower A':[['Back squat',4,'5-8',180],['Romanian deadlift',3,'8-10',150],['Leg press',3,'10-12',120],['Leg curl',3,'10-12',90],['Calf raise',4,'12-15',60]],
  'Upper A':[['Bench press',4,'5-8',180],['Barbell row',4,'6-10',150],['Overhead press',3,'8-10',150],['Lat pulldown',3,'10-12',90],['Lateral raise',3,'12-15',60],['Barbell curl',3,'10-12',60]]
};

let S = {
  exercises: [], plans: [], sessions: [],
  settings: { id:'settings', restDefault:120, autoRest:true, sound:true, keepAwake:true, unit:'kg', updated_at:0 },
  active: null,
  lastSync: 0
};
let dirty = new Set();
let view = 'train';
let progressEx = null, progressMetric = 'e1rm';
let tickHandle = null;

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const slug = s => 'ex-' + String(s).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
const live = arr => arr.filter(r=>!r.deleted);
const exById = id => S.exercises.find(e=>e.id===id);
const num = v => { const n = parseFloat(v); return isFinite(n) ? n : 0; };
const round = n => Math.round(n*100)/100;
const round1 = n => Math.round(n*10)/10;
const e1rm = (kg,reps) => reps>0 ? kg*(1+reps/30) : 0;
const stepOf = exId => { const e = exById(exId); return (e && e.step) || 2.5; };

function fmtDate(ts){ return new Date(ts).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}); }
function fmtShort(ts){ return new Date(ts).toLocaleDateString('en-GB',{day:'2-digit',month:'short'}); }
function fmtDur(ms){
  const s = Math.max(0,Math.floor(ms/1000));
  const h = Math.floor(s/3600), m = Math.floor(s%3600/60), sec = s%60;
  const p = n => String(n).padStart(2,'0');
  return h>0 ? `${h}:${p(m)}:${p(sec)}` : `${p(m)}:${p(sec)}`;
}
function fmtClock(sec){
  const neg = sec<0; sec = Math.abs(sec);
  return (neg?'+':'') + Math.floor(sec/60) + ':' + String(sec%60).padStart(2,'0');
}
function fmtRest(s){ return s<60 ? s+'s' : Math.floor(s/60)+'m'+(s%60?' '+(s%60)+'s':''); }
function fmtKg(n){ return n>=10000 ? (n/1000).toFixed(1)+'t' : Math.round(n).toLocaleString('en-GB'); }
function esc(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function toastAction(msg, label, fn){
  const t = document.getElementById('toast');
  t.innerHTML = `<span>${msg}</span><button class="btn sm" id="toastbtn" style="margin-left:12px;min-height:32px">${label}</button>`;
  t.classList.add('on'); t.style.pointerEvents = 'auto';
  document.getElementById('toastbtn').onclick = ()=>{
    t.classList.remove('on'); t.style.pointerEvents = 'none'; fn();
  };
  clearTimeout(t._h);
  t._h = setTimeout(()=>{ t.classList.remove('on'); t.style.pointerEvents = 'none'; }, 7000);
}

function toast(msg, ms){
  const t = document.getElementById('toast');
  t.innerHTML = msg; t.classList.add('on');
  clearTimeout(t._h); t._h = setTimeout(()=>t.classList.remove('on'), ms||2800);
}

/* ======================================================================
   persistence
   ====================================================================== */
function saveLocal(){ try{ LOCAL.setItem(LKEY, JSON.stringify(S)); }catch(e){} }
function commit(rec){ rec.updated_at = Date.now(); dirty.add(rec.id); saveLocal(); Sync.schedule(); }
function drop(rec){ rec.deleted = true; commit(rec); }

const Sync = {
  mode:'unknown', status:'local', token: LOCAL.getItem(TKEY) || null, timer:null, running:false,

  dot(s){ this.status = s; const d = document.getElementById('syncdot'); if(d) d.dataset.s = s; },

  async probe(){
    // This build has no server by design. Everything lives on the phone.
    this.mode = 'local';
    this.dot('local');
    return this.mode;
  },

  async login(passphrase){
    const r = await fetch('api/login', { method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ passphrase }) });
    const d = await r.json().catch(()=>({}));
    if(!r.ok) throw new Error(d.error || 'Sign in failed.');
    this.token = d.token; LOCAL.setItem(TKEY, d.token);
    return true;
  },
  signOut(){ this.token = null; LOCAL.removeItem(TKEY); this.dot('off'); render(); },

  records(){
    const out = [];
    const add = (kind,r) => out.push({ id:r.id, kind, payload:r, updated_at:r.updated_at||0, deleted:!!r.deleted });
    S.exercises.forEach(r=>{ if(dirty.has(r.id)) add('exercise', r); });
    S.plans.forEach(r=>{ if(dirty.has(r.id)) add('plan', r); });
    S.sessions.forEach(r=>{ if(dirty.has(r.id)) add('session', r); });
    if(dirty.has('settings')) add('setting', S.settings);
    return out;
  },

  merge(records){
    let changed = false;
    for(const r of records){
      if(r.kind==='setting'){
        if(r.updated_at > (S.settings.updated_at||0)){ S.settings = Object.assign(S.settings, r.payload); changed = true; }
        continue;
      }
      const coll = r.kind==='exercise' ? S.exercises : r.kind==='plan' ? S.plans : r.kind==='session' ? S.sessions : null;
      if(!coll) continue;
      const i = coll.findIndex(x=>x.id===r.id);
      const incoming = Object.assign({}, r.payload, { id:r.id, updated_at:r.updated_at, deleted:r.deleted });
      if(i<0){ coll.push(incoming); changed = true; }
      else if(r.updated_at > (coll[i].updated_at||0)){ coll[i] = incoming; changed = true; }
    }
    return changed;
  },

  schedule(){
    if(this.mode!=='server' || !this.token) return;
    clearTimeout(this.timer);
    this.timer = setTimeout(()=>this.run(), 1200);
  },

  async run(){
    if(this.mode!=='server' || !this.token || this.running) return;
    if(!navigator.onLine){ this.dot('off'); return; }
    this.running = true; this.dot('busy');
    const pushed = this.records();
    try{
      const r = await fetch('api/sync', { method:'POST',
        headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer '+this.token },
        body: JSON.stringify({ since:S.lastSync||0, records:pushed }) });
      if(r.status===401){ this.token=null; LOCAL.removeItem(TKEY); this.dot('off'); this.running=false; render(); return; }
      if(!r.ok) throw new Error('sync failed');
      const d = await r.json();
      pushed.forEach(p=>dirty.delete(p.id));
      const changed = this.merge(d.records||[]);
      S.lastSync = d.now;
      saveLocal();
      this.dot('ok');
      if(changed && !S.active) render();
    }catch(e){ this.dot('off'); }
    finally{ this.running = false; if(dirty.size) this.schedule(); }
  }
};

window.addEventListener('online', ()=>Sync.run());
window.addEventListener('offline', ()=>Sync.dot('off'));


/* ======================================================================
   backup to a private GitHub repo

   Every finished session is written to a file in a repo you own, through
   the Contents API. Because each write is a commit, you get the whole
   history rather than one file that can be overwritten with something
   broken: a bad save three weeks ago is still sitting there, restorable.
   The token lives only on this phone, in this app's storage.
   ====================================================================== */
const GKEY = 'plateledger:gh';

const b64 = str => {
  const bytes = new TextEncoder().encode(str);
  let bin = '';
  for(let i=0;i<bytes.length;i+=8192) bin += String.fromCharCode.apply(null, bytes.subarray(i,i+8192));
  return btoa(bin);
};
const unb64 = t => new TextDecoder().decode(Uint8Array.from(atob(String(t).replace(/\s/g,'')), c=>c.charCodeAt(0)));

function snapshot(){
  return {
    app:'plate-ledger', version:2,
    exported:new Date().toISOString(),
    sessions_logged: live(S.sessions).filter(x=>x.end).length,
    exercises:S.exercises, plans:S.plans, sessions:S.sessions, settings:S.settings
  };
}

const Backup = {
  cfg:{ token:'', repo:'', path:'plate-ledger.json', auto:true, lastAt:0, lastSha:'', pending:false },
  busy:false,

  init(){
    try{ Object.assign(this.cfg, JSON.parse(LOCAL.getItem(GKEY) || '{}')); }catch(e){}
    this.dot();
    if(this.on && this.cfg.pending) this.push('catching up');
  },
  save(){ LOCAL.setItem(GKEY, JSON.stringify(this.cfg)); },
  get on(){ return !!(this.cfg.token && this.cfg.repo); },

  dot(state){
    const d = document.getElementById('syncdot');
    if(!d) return;
    d.dataset.s = state || (!this.on ? 'off' : this.cfg.pending ? 'wait' : 'ok');
  },

  headers(){
    return { 'Authorization':'Bearer '+this.cfg.token,
             'Accept':'application/vnd.github+json',
             'X-GitHub-Api-Version':'2022-11-28' };
  },

  // "owner/repo", a full URL, or a .git clone string all mean the same thing
  parseRepo(v){
    const m = String(v).trim().replace(/\.git$/,'').match(/([\w.-]+)\/([\w.-]+)\/?$/);
    return m ? `${m[1]}/${m[2]}` : '';
  },

  // 404 is left to the caller: on the repo it means wrong name, but on the
  // file it just means nothing has been backed up yet, which is fine.
  async api(path, opts){
    const r = await fetch('https://api.github.com'+path, Object.assign({ headers:this.headers() }, opts||{}));
    if(r.status === 401) throw new Error('That token was rejected. Make a new one and paste it again.');
    if(r.status === 403) throw new Error('The token does not have permission to write to that repo.');
    return r;
  },

  async connect(token, repoInput){
    const repo = this.parseRepo(repoInput);
    if(!token) throw new Error('Paste the token first.');
    if(!repo) throw new Error('Write the repo as owner/name, like jad/lift-data.');
    const saved = this.cfg.token;
    this.cfg.token = token.trim();
    try{
      const r = await this.api('/repos/'+repo);
      if(r.status === 404) throw new Error('Cannot find that repo. Check the owner/name, and that the token can see it.');
      const info = await r.json();
      if(!info.permissions || !info.permissions.push)
        throw new Error('That token can read the repo but not write to it. Give it Contents: read and write.');
      this.cfg.repo = repo; this.cfg.lastSha = ''; this.cfg.pending = false;
      this.save();
      return info;
    }catch(e){ this.cfg.token = saved; throw e; }
  },

  disconnect(){
    this.cfg = { token:'', repo:'', path:'plate-ledger.json', auto:true, lastAt:0, lastSha:'', pending:false };
    this.save(); this.dot(); render();
  },

  async currentSha(){
    if(this.cfg.lastSha) return this.cfg.lastSha;
    const r = await this.api(`/repos/${this.cfg.repo}/contents/${this.cfg.path}`);
    if(r.status === 404){ this.cfg.lastSha = ''; return ''; }   // nothing backed up yet
    const d = await r.json();
    return d.sha || '';
  },

  async push(reason){
    if(!this.on || this.busy) return false;
    if(!navigator.onLine){ this.cfg.pending = true; this.save(); this.dot('wait'); return false; }
    this.busy = true; this.dot('busy');
    const body = sha => JSON.stringify({
      message: `${reason || 'update'} · ${live(S.sessions).filter(x=>x.end).length} sessions`,
      content: b64(JSON.stringify(snapshot(), null, 2)),
      sha: sha || undefined
    });
    try{
      let sha = await this.currentSha();
      let r = await this.api(`/repos/${this.cfg.repo}/contents/${this.cfg.path}`, { method:'PUT', body:body(sha) });
      if(r.status === 409 || r.status === 422){
        // someone (another device, or us) moved it on. Re-read and retry once.
        this.cfg.lastSha = '';
        sha = await this.currentSha();
        r = await this.api(`/repos/${this.cfg.repo}/contents/${this.cfg.path}`, { method:'PUT', body:body(sha) });
      }
      if(!r.ok) throw new Error('GitHub refused the write.');
      const d = await r.json();
      this.cfg.lastSha = d.content && d.content.sha ? d.content.sha : '';
      this.cfg.lastAt = Date.now();
      this.cfg.pending = false;
      this.save(); this.dot('ok');
      return true;
    }catch(e){
      this.cfg.pending = true; this.save(); this.dot('wait');
      return false;
    }finally{ this.busy = false; }
  },

  auto(reason){ if(this.on && this.cfg.auto) this.push(reason); },

  async versions(){
    const r = await this.api(`/repos/${this.cfg.repo}/commits?path=${encodeURIComponent(this.cfg.path)}&per_page=15`);
    if(r.status === 404) return [];
    if(!r.ok) throw new Error('Could not read the backup history.');
    const list = await r.json();
    return list.map(c=>({ sha:c.sha, when:c.commit.author.date, message:c.commit.message }));
  },

  async fetchAt(sha){
    const r = await this.api(`/repos/${this.cfg.repo}/contents/${this.cfg.path}?ref=${encodeURIComponent(sha)}`);
    if(!r.ok) throw new Error('Could not read that version.');
    const d = await r.json();
    return JSON.parse(unb64(d.content));
  }
};

function restoreFrom(data){
  if(!data || !data.exercises || !data.sessions) throw new Error('That is not a Plate Ledger backup.');
  S = Object.assign({ exercises:[], plans:[], sessions:[], settings:S.settings, active:null, lastSync:0 }, data);
  S.active = null;
  saveLocal(); render();
}

window.addEventListener('online', ()=>{ if(Backup.cfg.pending) Backup.push('catching up'); });

/* ======================================================================
   sound

   Safari will not play a beep from a page that has been backgrounded or
   from behind the lock screen unless an audio element is already playing.
   So a near-silent loop is started on the first tap of a session and left
   running: it holds the audio session open, costs nothing audible, and
   means the rest alarm still sounds with the phone face down in your bag.
   iOS ignores navigator.vibrate entirely, so sound is the only channel.
   ====================================================================== */
const Sound = {
  keeper:null, bell:null, armed:false,

  wav(seconds, rate, sample){
    const n = Math.floor(seconds*rate);
    const buf = new ArrayBuffer(44 + n*2), v = new DataView(buf);
    const str = (o,s)=>{ for(let i=0;i<s.length;i++) v.setUint8(o+i, s.charCodeAt(i)); };
    str(0,'RIFF'); v.setUint32(4, 36+n*2, true); str(8,'WAVE'); str(12,'fmt ');
    v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,1,true);
    v.setUint32(24,rate,true); v.setUint32(28,rate*2,true); v.setUint16(32,2,true); v.setUint16(34,16,true);
    str(36,'data'); v.setUint32(40, n*2, true);
    for(let i=0;i<n;i++){
      const x = Math.max(-1, Math.min(1, sample(i/rate)));
      v.setInt16(44+i*2, x<0 ? x*0x8000 : x*0x7FFF, true);
    }
    let bin = '';
    const bytes = new Uint8Array(buf);
    for(let i=0;i<bytes.length;i+=8192) bin += String.fromCharCode.apply(null, bytes.subarray(i,i+8192));
    return 'data:audio/wav;base64,' + btoa(bin);
  },

  build(){
    if(this.keeper) return;
    // inaudible, but not digital silence: iOS drops a truly silent track
    this.keeper = new Audio(this.wav(2, 8000, t => Math.sin(2*Math.PI*60*t) * 0.0002));
    this.keeper.loop = true;
    this.keeper.preload = 'auto';
    this.keeper.setAttribute('playsinline','');
    // three rising tones, short enough not to annoy the rack next to you
    this.bell = new Audio(this.wav(1.1, 22050, t => {
      const beep = (start, dur, hz) => (t>=start && t<start+dur)
        ? Math.sin(2*Math.PI*hz*(t-start)) * Math.min(1,(t-start)/0.01) * Math.max(0,1-(t-start)/dur) * 0.55 : 0;
      return beep(0,0.16,784) + beep(0.24,0.16,880) + beep(0.48,0.34,1046);
    }));
    this.bell.preload = 'auto';
    this.bell.setAttribute('playsinline','');
  },

  arm(){
    if(!S.settings.sound || this.armed) return;
    this.build();
    const p = this.keeper.play();
    if(p && p.catch) p.catch(()=>{});
    this.armed = true;
  },
  release(){
    if(this.keeper){ this.keeper.pause(); }
    this.armed = false;
  },
  ring(){
    if(!S.settings.sound) return;
    this.build();
    try{ this.bell.currentTime = 0; const p = this.bell.play(); if(p&&p.catch) p.catch(()=>{}); }catch(e){}
    if(navigator.vibrate) try{ navigator.vibrate([180,90,180,90,260]); }catch(e){}
  }
};

/* screen wake lock: the phone staying lit through a set is worth the battery */
const Wake = {
  lock:null,
  async on(){
    if(!S.settings.keepAwake || !('wakeLock' in navigator) || this.lock) return;
    try{
      this.lock = await navigator.wakeLock.request('screen');
      this.lock.addEventListener('release', ()=>{ this.lock = null; });
    }catch(e){}
  },
  off(){ if(this.lock){ try{ this.lock.release(); }catch(e){} this.lock = null; } }
};
document.addEventListener('visibilitychange', ()=>{
  if(document.hidden) return;
  if(S.active) Wake.on();
  Rest.paint();
  Sync.run();
});

/* ======================================================================
   rest timer
   ====================================================================== */
const Rest = {
  endsAt:0, total:0, label:'', alerted:false, handle:null,

  restore(){
    try{
      const r = JSON.parse(LOCAL.getItem(RKEY) || 'null');
      if(r && r.endsAt > Date.now() - 120000){ Object.assign(this, r); this.loop(); }
    }catch(e){}
  },
  persist(){ LOCAL.setItem(RKEY, JSON.stringify({ endsAt:this.endsAt, total:this.total, label:this.label, alerted:this.alerted })); },
  get active(){ return this.endsAt > 0; },
  get left(){ return Math.round((this.endsAt - Date.now())/1000); },

  start(seconds, label){
    this.total = seconds; this.endsAt = Date.now() + seconds*1000;
    this.label = label || 'Rest'; this.alerted = false;
    this.persist(); Sound.arm(); this.loop(); drawLiveBar();
  },
  bump(seconds){
    if(!this.active) return;
    this.endsAt += seconds*1000;
    this.total = Math.max(this.total + seconds, 15);
    if(this.left > 0) this.alerted = false;
    this.persist(); this.paint();
  },
  stop(){
    this.endsAt = 0; this.total = 0; this.alerted = false;
    clearInterval(this.handle); this.handle = null;
    LOCAL.removeItem(RKEY); drawLiveBar();
  },
  loop(){ clearInterval(this.handle); this.handle = setInterval(()=>this.paint(), 250); this.paint(); },
  paint(){
    if(!this.active) return;
    const left = this.left;
    if(left <= 0 && !this.alerted){ this.alerted = true; this.persist(); Sound.ring(); toast('Rest over &middot; ' + esc(this.label)); }
    if(left < -180) return this.stop();
    const bar = document.querySelector('.livebar');
    if(!bar || !bar.classList.contains('resting')) return drawLiveBar();
    const clock = bar.querySelector('.clock');
    const fill = bar.querySelector('.restbar i');
    const wrap = bar.querySelector('.restbar');
    if(clock) clock.textContent = fmtClock(left);
    if(fill) fill.style.width = Math.max(0, Math.min(100, (1 - left/this.total)*100)) + '%';
    if(wrap) wrap.classList.toggle('done', left<=0);
    bar.classList.toggle('over', left<=0);
  }
};

/* ======================================================================
   derived numbers
   ====================================================================== */
function validSet(s){ return s.done && num(s.kg)>0 && num(s.reps)>0; }
function doneSets(entry){ return entry.sets.filter(validSet); }
function entryVolume(entry){ return doneSets(entry).reduce((a,s)=>a+num(s.kg)*num(s.reps),0); }
function sessionVolume(sess){ return sess.entries.reduce((a,e)=>a+entryVolume(e),0); }
function sessionSets(sess){ return sess.entries.reduce((a,e)=>a+doneSets(e).length,0); }

function history(exId, beforeTs){
  return live(S.sessions)
    .filter(s => s.end && (beforeTs ? s.end < beforeTs : true))
    .map(s => ({ sess:s, entry:s.entries.find(e=>e.exId===exId) }))
    .filter(x => x.entry && doneSets(x.entry).length)
    .sort((a,b)=>b.sess.end-a.sess.end);
}
function lastEntry(exId){ const h = history(exId); return h.length ? h[0] : null; }
function priorSets(exId, beforeTs){
  const out = [];
  history(exId, beforeTs).forEach(x => doneSets(x.entry).forEach(s => out.push({ kg:num(s.kg), reps:num(s.reps), t:x.sess.end })));
  return out;
}
function bestE1rm(exId, beforeTs){ return priorSets(exId, beforeTs).reduce((m,s)=>Math.max(m, e1rm(s.kg,s.reps)), 0); }

/* ----------------------------------------------------------------------
   personal bests, checked against every set logged before this session
     weight  a heavier top set than you have ever completed on that lift
     reps    more reps at a weight you have used before
     est 1rm neither of those, but a better estimated max (Epley)
   A first-ever log never counts, or every new movement fires on day one.
---------------------------------------------------------------------- */
function findPBs(entry, beforeTs){
  const ex = exById(entry.exId);
  const prior = priorSets(entry.exId, beforeTs);
  const sets = doneSets(entry).map(s=>({ kg:num(s.kg), reps:num(s.reps) }));
  if(!prior.length || !sets.length) return [];

  const out = [];
  const priorMaxKg = prior.reduce((m,s)=>Math.max(m,s.kg),0);
  const priorBestE = prior.reduce((m,s)=>Math.max(m,e1rm(s.kg,s.reps)),0);
  const bestAt = kg => prior.filter(s=>Math.abs(s.kg-kg) < 0.001).reduce((m,s)=>s.reps>m.reps?s:m, {kg,reps:0});
  const name = ex ? ex.name : 'Exercise';
  const u = S.settings.unit;

  const topKg = sets.reduce((m,s)=>Math.max(m,s.kg),0);
  if(topKg > priorMaxKg){
    const s = sets.filter(x=>x.kg===topKg).sort((a,b)=>b.reps-a.reps)[0];
    out.push({ type:'weight', exId:entry.exId, name,
      what:`${name} ${topKg} ${u} x ${s.reps}`, was:`was ${priorMaxKg} ${u}`, gain:round1(topKg-priorMaxKg) });
  }

  let repPB = null;
  sets.forEach(s=>{
    const before = bestAt(s.kg);
    if(before.reps > 0 && s.reps > before.reps){
      const gain = s.reps - before.reps;
      if(!repPB || gain > repPB.gain || (gain===repPB.gain && s.kg>repPB.kg))
        repPB = { kg:s.kg, reps:s.reps, before:before.reps, gain };
    }
  });
  if(repPB) out.push({ type:'reps', exId:entry.exId, name,
    what:`${name} ${repPB.kg} ${u} x ${repPB.reps}`, was:`was ${repPB.kg} ${u} x ${repPB.before}`, gain:repPB.gain });

  const bestE = sets.reduce((m,s)=>Math.max(m,e1rm(s.kg,s.reps)),0);
  if(bestE > priorBestE + 0.05 && !out.length){
    const s = sets.slice().sort((a,b)=>e1rm(b.kg,b.reps)-e1rm(a.kg,a.reps))[0];
    out.push({ type:'est 1rm', exId:entry.exId, name,
      what:`${name} ${s.kg} ${u} x ${s.reps}, a ${round1(bestE)} ${u} estimated max`,
      was:`was ${round1(priorBestE)} ${u}`, gain:round1(bestE-priorBestE) });
  }
  return out;
}

function isPBSet(entry, set, beforeTs){
  const kg = num(set.kg), reps = num(set.reps);
  if(!set.done || !kg || !reps) return false;
  const prior = priorSets(entry.exId, beforeTs);
  if(!prior.length) return false;
  if(kg > prior.reduce((m,s)=>Math.max(m,s.kg),0)) return true;
  const at = prior.filter(s=>Math.abs(s.kg-kg) < 0.001).reduce((m,s)=>Math.max(m,s.reps),0);
  if(at>0 && reps>at) return true;
  return e1rm(kg,reps) > prior.reduce((m,s)=>Math.max(m,e1rm(s.kg,s.reps)),0) + 0.05;
}


/* ======================================================================
   gestures

   Two things a gym app needs and a web page does not give you: a row you
   can shove aside to delete, and a block you can pick up and drop somewhere
   else when the machine you wanted is taken.
   ====================================================================== */

/* --- swipe a row to reveal Delete, either direction --- */
function makeSwipe(container){
  let row=null, body=null, x0=0, y0=0, dx=0, locked=null, openRow=null;
  const OPEN = 94, TRIGGER = 46;

  const close = r => { if(r){ r.classList.remove('sliding'); r.querySelector('.swipe-body').style.transform=''; } };
  const closeAll = except => container.querySelectorAll('.swipe').forEach(r=>{ if(r!==except) close(r); });

  container.addEventListener('pointerdown', ev=>{
    if(ev.target.closest('.swipe-del')) return;
    row = ev.target.closest('.swipe');
    if(!row) return;
    body = row.querySelector('.swipe-body');
    x0 = ev.clientX; y0 = ev.clientY; dx = 0; locked = null;
  });

  container.addEventListener('pointermove', ev=>{
    if(!row) return;
    const mx = ev.clientX - x0, my = ev.clientY - y0;
    if(locked === null){
      if(Math.abs(mx) < 8 && Math.abs(my) < 8) return;
      locked = Math.abs(mx) > Math.abs(my) ? 'x' : 'y';       // let vertical scrolls through
      if(locked === 'x'){ row.classList.add('sliding'); closeAll(row); }
    }
    if(locked !== 'x') return;
    dx = Math.max(-OPEN, Math.min(OPEN, mx));
    body.style.transform = `translateX(${dx}px)`;
  });

  const end = ()=>{
    if(!row || locked !== 'x'){ row = null; return; }
    row.classList.remove('sliding');
    if(Math.abs(dx) > TRIGGER){
      body.style.transform = `translateX(${dx > 0 ? OPEN : -OPEN}px)`;
      openRow = row;
    }else{
      body.style.transform = '';
      if(openRow === row) openRow = null;
    }
    row = null;
  };
  container.addEventListener('pointerup', end);
  container.addEventListener('pointercancel', end);
  container.addEventListener('pointerleave', end);

  // tapping anywhere else puts an open row back
  container.addEventListener('click', ev=>{
    if(openRow && !ev.target.closest('.swipe-del')){
      const r = openRow;
      if(!ev.target.closest('.swipe') || ev.target.closest('.swipe') === r){ close(r); openRow = null; }
    }
  }, true);
}

/* --- hold an item, drag it above or below its neighbours --- */
function makeSortable(container, itemSel, onDrop){
  let held=null, el=null, items=[], from=-1, to=-1, y0=0, dragging=false, line=null;

  const cleanup = ()=>{
    clearTimeout(held); held = null;
    if(el){ el.classList.remove('dragging-item'); el.style.transform = ''; }
    if(line && line.parentNode) line.remove();
    document.body.classList.remove('dragging-on');
    el = null; dragging = false;
  };

  container.addEventListener('pointerdown', ev=>{
    if(ev.target.closest('input,button,select,a,.stepper')) return;
    const it = ev.target.closest(itemSel);
    if(!it || !container.contains(it)) return;
    y0 = ev.clientY;
    const x0 = ev.clientX;
    held = setTimeout(()=>{
      dragging = true; el = it;
      items = [...container.querySelectorAll(itemSel)];
      from = items.indexOf(it); to = from;
      el.classList.add('dragging-item');
      document.body.classList.add('dragging-on');
      if(!line){ line = document.createElement('div'); line.className = 'drop-line'; }
      if(navigator.vibrate) try{ navigator.vibrate(12); }catch(e){}
    }, 340);
    const abort = e2 => {
      if(dragging) return;
      if(Math.abs(e2.clientY-y0) > 10 || Math.abs(e2.clientX-x0) > 10){ clearTimeout(held); held = null; }
    };
    container.addEventListener('pointermove', abort, { once:false });
    setTimeout(()=>container.removeEventListener('pointermove', abort), 400);
  });

  document.addEventListener('pointermove', ev=>{
    if(!dragging || !el) return;
    ev.preventDefault();
    el.style.transform = `translateY(${ev.clientY - y0}px)`;
    const r = el.getBoundingClientRect();
    const mid = r.top + r.height/2;
    const others = items.filter(x=>x!==el);
    to = others.filter(x=>{ const b = x.getBoundingClientRect(); return b.top + b.height/2 < mid; }).length;
    if(others[to]) others[to].parentNode.insertBefore(line, others[to]);
    else container.appendChild(line);
  }, { passive:false });

  const drop = ()=>{
    if(!dragging){ clearTimeout(held); held = null; return; }
    const f = from, t = to;
    cleanup();
    if(f !== t && f >= 0) onDrop(f, t);
  };
  document.addEventListener('pointerup', drop);
  document.addEventListener('pointercancel', ()=>cleanup());
}

function wireGestures(){
  const stack = document.getElementById('exstack');
  if(stack && S.active){
    makeSortable(stack, '.exblock', (from,to)=>{
      const a = S.active.entries;
      const [moved] = a.splice(from,1);
      a.splice(to,0,moved);
      saveLocal(); render();
      toast('Moved to position ' + (to+1) + '.');
    });
  }
  document.querySelectorAll('[data-swipe]').forEach(makeSwipe);
}

/* ======================================================================
   history: recalculating bests after an edit

   Personal bests are measured against everything logged before a session,
   so correcting a set in March changes what counted as a best in April.
   Any edit or deletion therefore rebuilds the whole ladder in order.
   ====================================================================== */
function recomputePBs(){
  live(S.sessions).filter(s=>s.end).sort((a,b)=>a.end-b.end).forEach(s=>{
    const prs = [];
    s.entries.forEach(e=>{ findPBs(e, s.start).forEach(p=>prs.push(p)); });
    s.prs = prs;
    s.updated_at = Date.now();
    dirty.add(s.id);
  });
  saveLocal();
}

function deleteSession(id){
  const s = S.sessions.find(x=>x.id===id);
  if(!s) return;
  const name = s.name;
  s.deleted = true; commit(s); recomputePBs(); render();
  toastAction(`Deleted ${esc(name)}.`, 'Undo', ()=>{
    s.deleted = false; commit(s); recomputePBs(); render();
    toast('Back.');
    Backup.auto('undo delete');
  });
  Backup.auto('deleted a session');
}

/* ======================================================================
   editing a finished session
   ====================================================================== */
let editDraft = null;

function editSession(id){
  const src = live(S.sessions).find(s=>s.id===id);
  if(!src) return;
  editDraft = JSON.parse(JSON.stringify(src));

  const body = () => `
    <div class="field" style="margin-bottom:12px">
      <label for="ename">Session</label>
      <input class="inp" id="ename" value="${esc(editDraft.name)}">
    </div>
    <div class="field" style="margin-bottom:16px">
      <label for="edate">Date</label>
      <input class="inp" id="edate" type="date" value="${new Date(editDraft.end).toISOString().slice(0,10)}">
    </div>
    ${editDraft.entries.map((e,i)=>{
      const ex = exById(e.exId);
      return `<section class="exblock" style="margin-bottom:12px">
        <div class="exhead">
          <span class="nm">${esc(ex?ex.name:'Exercise')}</span>
          <button class="del" data-eact="rm-ex" data-e="${i}" style="margin-left:auto">&times;</button>
        </div>
        <div class="gridhead" style="grid-template-columns:1fr 1fr 40px"><span>${S.settings.unit}</span><span>Reps</span><span></span></div>
        ${e.sets.map((st,j)=>`
          <div class="editrow" data-e="${i}" data-s="${j}">
            <div class="stepper">
              <button data-eact="dec" data-f="kg" data-e="${i}" data-s="${j}">&minus;</button>
              <input class="num" data-f="kg" data-e="${i}" data-s="${j}" type="text" inputmode="decimal" value="${st.kg}">
              <button data-eact="inc" data-f="kg" data-e="${i}" data-s="${j}">+</button>
            </div>
            <div class="stepper">
              <button data-eact="dec" data-f="reps" data-e="${i}" data-s="${j}">&minus;</button>
              <input class="num" data-f="reps" data-e="${i}" data-s="${j}" type="text" inputmode="numeric" value="${st.reps}">
              <button data-eact="inc" data-f="reps" data-e="${i}" data-s="${j}">+</button>
            </div>
            <button class="del" data-eact="rm-set" data-e="${i}" data-s="${j}">&times;</button>
          </div>`).join('')}
        <div class="exfoot"><button class="btn sm ghost" data-eact="add-set" data-e="${i}">Add set</button></div>
      </section>`;
    }).join('')}
    <button class="btn wide ghost" data-eact="add-ex" style="margin-bottom:12px">Add exercise</button>
    <button class="btn wide" data-eact="reopen" style="margin-bottom:12px">Reopen and carry on training</button>
    <button class="btn wide ghost danger" data-eact="del-session">Delete this session</button>`;

  const paint = ()=>{
    modal('Edit session', body(),
      `<button class="btn ghost" data-act="close">Cancel</button><button class="btn primary" id="esave">Save</button>`);
    const root = document.querySelector('#modal-root .body');

    root.addEventListener('click', ev=>{
      const b = ev.target.closest('[data-eact]'); if(!b) return;
      const i = +b.dataset.e, j = +b.dataset.s;
      const act = b.dataset.eact;
      editDraft.name = document.getElementById('ename').value;
      if(act==='inc' || act==='dec'){
        const st = editDraft.entries[i].sets[j];
        const step = b.dataset.f==='kg' ? stepOf(editDraft.entries[i].exId) : 1;
        const next = Math.max(0, round(num(st[b.dataset.f]) + (act==='inc'?step:-step)));
        st[b.dataset.f] = next;
        root.querySelector(`input[data-f="${b.dataset.f}"][data-e="${i}"][data-s="${j}"]`).value = next;
        return;                                    // patch in place, no repaint
      }
      if(act==='rm-set'){
        editDraft.entries[i].sets.splice(j,1);
        if(!editDraft.entries[i].sets.length) editDraft.entries.splice(i,1);
      }
      if(act==='rm-ex') editDraft.entries.splice(i,1);
      if(act==='add-set'){
        const last = editDraft.entries[i].sets.slice(-1)[0] || {kg:0,reps:0};
        editDraft.entries[i].sets.push({ kg:last.kg, reps:last.reps, done:true });
      }
      if(act==='add-ex'){
        pickExercise(exId=>{
          editDraft.entries.push({ exId, target:'', sets:[{kg:0,reps:0,done:true}] });
          paint();
        });
        return;
      }
      if(act==='reopen'){
        closeModal();
        resumeSession(id);
        return;
      }
      if(act==='del-session'){
        if(confirm('Delete this whole session?')){ closeModal(); deleteSession(id); }
        return;
      }
      paint();
    });

    root.addEventListener('input', ev=>{
      const el = ev.target.closest('input[data-f]'); if(!el) return;
      const st = editDraft.entries[+el.dataset.e].sets[+el.dataset.s];
      st[el.dataset.f] = num(el.value.replace(/[^0-9.]/g,''));
    });

    document.getElementById('esave').onclick = ()=>{
      const target = S.sessions.find(x=>x.id===id);
      editDraft.name = document.getElementById('ename').value.trim() || target.name;
      const d = document.getElementById('edate').value;
      if(d){
        const keep = new Date(target.end);
        const nd = new Date(d + 'T00:00:00');
        nd.setHours(keep.getHours(), keep.getMinutes());
        const shift = nd.getTime() - target.end;
        editDraft.end = nd.getTime();
        editDraft.start = target.start + shift;
      }
      editDraft.entries = editDraft.entries
        .map(e=>({ ...e, sets: e.sets.filter(st=>num(st.kg)>0 && num(st.reps)>0).map(st=>({ kg:num(st.kg), reps:num(st.reps), done:true })) }))
        .filter(e=>e.sets.length);
      if(!editDraft.entries.length){
        if(!confirm('Every set has been removed. Delete the session?')) return;
        closeModal(); deleteSession(id); return;
      }
      Object.assign(target, editDraft);
      commit(target);
      recomputePBs();
      closeModal(); render();
      toast('Session updated.');
      Backup.auto('edited a session');
    };
  };
  paint();
}

/* ---------- PROGRESS ---------- */
function trained(){
  const ids = new Set();
  live(S.sessions).forEach(s=>s.entries.forEach(e=>{ if(doneSets(e).length) ids.add(e.exId); }));
  return [...ids].map(exById).filter(Boolean).sort((a,b)=>a.name.localeCompare(b.name));
}
function series(exId, metric){
  return history(exId).slice().reverse().map(x=>{
    const sets = doneSets(x.entry);
    let v;
    if(metric==='e1rm') v = sets.reduce((a,s)=>Math.max(a,e1rm(num(s.kg),num(s.reps))),0);
    else if(metric==='top') v = sets.reduce((a,s)=>Math.max(a,num(s.kg)),0);
    else v = entryVolume(x.entry);
    const top = sets.slice().sort((a,b)=>e1rm(num(b.kg),num(b.reps))-e1rm(num(a.kg),num(a.reps)))[0];
    return { t:x.sess.end, v:round1(v), sets:sets.length, vol:entryVolume(x.entry),
             top:`${top.kg}x${top.reps}`, name:x.sess.name, pb:(x.sess.prs||[]).some(p=>p.exId===exId) };
  });
}

function paintChart(){
  const host = document.getElementById('chart');
  if(!host) return;
  const data = series(progressEx, progressMetric);
  const W = Math.max(300, host.clientWidth || 360), H = 220;
  const pad = {l:38,r:14,t:20,b:28};
  const iw = W-pad.l-pad.r, ih = H-pad.t-pad.b;
  const vals = data.map(d=>d.v);
  let min = Math.min(...vals), max = Math.max(...vals);
  if(min===max){ min = min*0.9; max = max*1.1 || 1; }
  const span = max-min || 1;
  min -= span*0.12; max += span*0.12;
  const x = i => data.length===1 ? pad.l+iw/2 : pad.l + i*(iw/(data.length-1));
  const y = v => pad.t + ih - ((v-min)/(max-min))*ih;
  const best = Math.max(...vals);

  let grid = '', axis = '';
  for(let i=0;i<=4;i++){
    const val = min + (max-min)*i/4, yy = y(val);
    grid += `<line class="grid" x1="${pad.l}" y1="${yy.toFixed(1)}" x2="${W-pad.r}" y2="${yy.toFixed(1)}" opacity="${i===0?'1':'.45'}"/>`;
    axis += `<text class="axis" x="${pad.l-8}" y="${(yy+3.5).toFixed(1)}" text-anchor="end">${Math.round(val)}</text>`;
  }
  const step = Math.max(1, Math.ceil(data.length/5));
  data.forEach((d,i)=>{
    if(i%step===0 || i===data.length-1)
      axis += `<text class="axis" x="${x(i).toFixed(1)}" y="${H-9}" text-anchor="middle">${fmtShort(d.t)}</text>`;
  });
  const pts = data.map((d,i)=>`${x(i).toFixed(1)},${y(d.v).toFixed(1)}`).join(' ');
  const area = data.length>1 ? `<polygon class="area" points="${pad.l},${pad.t+ih} ${pts} ${(pad.l+iw)},${pad.t+ih}"/>` : '';
  const dots = data.map((d,i)=>`<circle class="dot${d.v===best?' best':''}" cx="${x(i).toFixed(1)}" cy="${y(d.v).toFixed(1)}" r="${d.v===best?4.5:3.5}"/>`).join('');
  const lastLbl = `<text class="val" x="${x(data.length-1).toFixed(1)}" y="${(y(data[data.length-1].v)-11).toFixed(1)}" text-anchor="${data.length>1?'end':'middle'}">${data[data.length-1].v}</text>`;

  host.innerHTML = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Trend chart">
    <defs><linearGradient id="fade" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#79A6D2" stop-opacity=".18"/>
      <stop offset="100%" stop-color="#79A6D2" stop-opacity="0"/>
    </linearGradient></defs>
    ${grid}${area}${data.length>1?`<polyline class="line" points="${pts}"/>`:''}${dots}${axis}${lastLbl}
  </svg>`;
}

/* ---------- dock ---------- */
function drawLiveBar(){
  const slot = document.getElementById('livebar-slot');
  document.body.classList.toggle('has-bar', !!(S.active || Rest.active));
  if(!S.active && !Rest.active){ slot.innerHTML = ''; clearInterval(tickHandle); tickHandle = null; return; }

  const wantRest = Rest.active;
  const mode = wantRest ? 'rest' : 'sess';
  if(slot.dataset.mode !== mode || !wantRest){
    slot.dataset.mode = mode;
    slot.innerHTML = wantRest ? `
      <div class="livebar resting">
        <div class="restbar"><i></i></div>
        <div class="in">
          <span class="clock">${fmtClock(Rest.left)}</span>
          <span class="meta">${esc(Rest.label)}</span>
          <span class="spacer">
            <button class="btn sm ghost" data-act="rest-minus">&minus;30</button>
            <button class="btn sm ghost" data-act="rest-plus">+30</button>
            <button class="btn sm primary" data-act="rest-skip">Done</button>
          </span>
        </div>
      </div>` : `
      <div class="livebar">
        <div class="in">
          <span class="clock" id="clock">${fmtDur(Date.now()-S.active.start)}</span>
          <span class="meta" id="livemeta"></span>
          <span class="spacer"><button class="btn sm primary" data-act="finish">Finish</button></span>
        </div>
      </div>`;
  }

  const upd = ()=>{
    if(Rest.active) return Rest.paint();
    if(!S.active) return;
    const c = document.getElementById('clock');
    if(c) c.textContent = fmtDur(Date.now()-S.active.start);
    const m = document.getElementById('livemeta');
    if(m) m.textContent = `${sessionSets(S.active)} sets &middot; ${fmtKg(sessionVolume(S.active))} ${S.settings.unit}`.replace('&middot;','·');
  };
  upd();
  if(!tickHandle) tickHandle = setInterval(upd, 1000);
}

function planEditor(planId){
  const source = planId ? live(S.plans).find(p=>p.id===planId) : { id:uid(), name:'', items:[] };

    };

    makeSortable(plist, '.item', (from,to)=>{

}

/* rest length and weight increment for one exercise, from the session */
function exerciseOptions(entry){
  const ex = exById(entry.exId);
  const rest = entry.rest || S.settings.restDefault;
  const step = stepOf(entry.exId);
  const last = lastEntry(entry.exId);
  modal(ex?ex.name:'Exercise', `
    <div class="stack" style="margin-bottom:20px">
      <button class="btn wide" data-swap>Swap for another exercise</button>
      ${last?`<button class="btn wide ghost" data-repeat>Repeat what I did last time</button>`:''}
      <button class="btn wide ghost danger" data-remove>Remove from this session</button>
    </div>
    <div class="eyebrow" style="margin-bottom:8px">Rest between sets</div>
    <div class="chips" style="margin-bottom:18px">${[60,90,120,150,180,210,240,300].map(s=>
      `<button class="btn${s===rest?' primary':''}" data-rest="${s}">${fmtRest(s)}</button>`).join('')}</div>
    <div class="eyebrow" style="margin-bottom:8px">Weight goes up in</div>
    <div class="chips">${[1,1.25,2,2.5,5,10].map(s=>
      `<button class="btn${s===step?' primary':''}" data-step="${s}">${s}</button>`).join('')}</div>`);
  document.querySelector('#modal-root .body').addEventListener('click', ev=>{
    const r = ev.target.closest('[data-rest]');
    const st = ev.target.closest('[data-step]');
    if(r){ entry.rest = +r.dataset.rest; saveLocal(); closeModal(); render(); }
    if(st && ex){ ex.step = +st.dataset.step; commit(ex); closeModal(); render(); }

    if(ev.target.closest('[data-swap]')){
      closeModal();
      pickExercise(newId=>{
        const prev = lastEntry(newId);
        const prevSets = prev ? doneSets(prev.entry) : [];
        entry.exId = newId;
        entry.target = '';
        // the numbers belonged to the old lift, so start from the new one's history
        entry.sets = entry.sets.map((old,i)=> old.done ? old
          : { kg: prevSets[i] ? prevSets[i].kg : '', reps:'', done:false });
        entry.rest = S.settings.restDefault;
        saveLocal(); render();
        toast('Swapped to ' + esc((exById(newId)||{}).name || 'exercise') + '.');
      });
      return;
    }
    if(ev.target.closest('[data-repeat]')){
      entry.sets = doneSets(last.entry).map(x=>({ kg:x.kg, reps:x.reps, done:false }));
      saveLocal(); closeModal(); render();
      return;
    }
    if(ev.target.closest('[data-remove]')){
      if(confirm('Remove this exercise from the session?')){
        S.active.entries = S.active.entries.filter(e=>e!==entry);
        saveLocal(); closeModal(); render();
      }
    }
  });
}

/* ======================================================================
   session actions
   ====================================================================== */
function startSession(plan){
  S.active = {
    id: uid(), planId: plan ? plan.id : null, name: plan ? plan.name : 'Freestyle',
    start: Date.now(), end: null, prs: [],
    entries: plan ? plan.items.map(it=>{
      const last = lastEntry(it.exId);
      const lastSets = last ? doneSets(last.entry) : [];
      return {
        exId: it.exId, target: `${it.sets} x ${it.reps}`, rest: it.rest || S.settings.restDefault,
        sets: Array.from({length:it.sets},(_,i)=>({ kg:lastSets[i]?lastSets[i].kg:'', reps:'', done:false }))
      };
    }) : []
  };
  view = 'train'; saveLocal(); Wake.on(); Sound.arm(); render();
}


/* ----------------------------------------------------------------------
   reopening a session you already finished

   Pulls it back out of history and makes it live again. The clock picks up
   from the duration it had, so an hour spent driving home does not land on
   your session time. Bests are recalculated on the way out and again when
   you finish for real, since while it is open it is not history.
---------------------------------------------------------------------- */
function resumeSession(id){
  if(S.active){
    toast('Finish or discard the session you are in first.');
    return false;
  }
  const i = S.sessions.findIndex(x=>x.id===id && !x.deleted);
  if(i < 0) return false;
  const sess = S.sessions[i];
  const ran = Math.max(0, (sess.end || Date.now()) - sess.start);

  S.sessions.splice(i,1);             // out of history first, so it is not its own baseline
  sess.start = Date.now() - ran;      // resume the clock, skip the gap
  sess.end = null;
  sess.prs = [];

  // Finishing dropped any exercise you never got to. If this came from a plan,
  // put those back in plan order, otherwise reopening a mistaken tap leaves you
  // rebuilding the second half of your session by hand.
  const plan = sess.planId ? live(S.plans).find(p=>p.id===sess.planId) : null;
  if(plan){
    const extras = sess.entries.filter(e=>!plan.items.some(it=>it.exId===e.exId));
    sess.entries = plan.items.map(it=>{
      const had = sess.entries.find(e=>e.exId===it.exId);
      if(had) return had;
      const prev = lastEntry(it.exId);
      const prevSets = prev ? doneSets(prev.entry) : [];
      return {
        exId: it.exId,
        target: `${it.sets} x ${it.reps}`,
        rest: it.rest || S.settings.restDefault,
        sets: Array.from({length:it.sets},(_,k)=>({ kg:prevSets[k]?prevSets[k].kg:'', reps:'', done:false }))
      };
    }).concat(extras);
  }

  S.active = sess;

  recomputePBs();
  view = 'train';
  saveLocal(); render(); Wake.on(); Sound.arm();
  toast('Back in ' + esc(sess.name) + '. Finish again when you are done.');
  return true;
}

function finishSession(){
  const a = S.active;
  if(!sessionSets(a)){
    if(!confirm('No sets are marked done. Discard this session?')) return;
    S.active = null; Rest.stop(); Wake.off(); Sound.release(); saveLocal(); render(); return;
  }
  const prs = [];
  a.entries.forEach(e=>{ findPBs(e, a.start).forEach(p=>prs.push(p)); });

  a.end = Date.now();
  a.entries = a.entries.filter(e=>doneSets(e).length);
  a.entries.forEach(e=>{ e.sets = e.sets.filter(validSet).map(s=>({ kg:num(s.kg), reps:num(s.reps), done:true })); });
  a.prs = prs;

  S.sessions.push(a);
  S.active = null;
  Rest.stop(); Wake.off(); Sound.release();
  commit(a);
  render();
  finishSummary(a, prs);
  Backup.auto('session: ' + a.name);
}

/* ======================================================================
   events
   ====================================================================== */
function nudge(entry, j, field, dir){
  const s = entry.sets[j];
  const step = field==='kg' ? stepOf(entry.exId) : 1;
  const base = num(s[field]);
  if(!base){
    // Nothing there yet. Pressing plus offers what you did last time, which
    // is usually the number you want. Pressing minus leaves it empty rather
    // than refilling something you just cleared.
    if(dir < 0) return;
    const last = lastEntry(entry.exId);
    const p = last ? doneSets(last.entry)[j] : null;
    s[field] = String(round(p ? num(p[field]) : step));
    saveLocal();
    return;
  }
  const next = Math.max(0, round(base + dir*step));
  s[field] = next ? String(next) : '';
  saveLocal();
}

document.addEventListener('click', ev=>{
  const t = ev.target;
  if(t.hasAttribute && t.hasAttribute('data-scrim')) return closeModal();

  const tab = t.closest('#tabs button');
  if(tab){ view = tab.dataset.view; closeModal(); render(); return; }

  const m = t.closest('#metric button');
  if(m){ progressMetric = m.dataset.m; render(); return; }

  if(t.id === 'dologin'){
    const pass = document.getElementById('pass').value;
    const err = document.getElementById('loginerr');
    err.textContent = '';
    Sync.login(pass)
      .then(async ()=>{ Sync.dot('ok'); await Sync.run(); seedIfEmpty(); render(); Sync.schedule(); })
      .catch(e=>{ err.textContent = e.message; });
    return;
  }

  const btn = t.closest('[data-act]');
  if(!btn) return;
  const act = btn.dataset.act;
  const block = btn.closest('[data-ex]');
  const entry = block && S.active ? S.active.entries.find(e=>e.exId===block.dataset.ex) : null;
  const rowEl = btn.closest('[data-set]');

  switch(act){
    case 'close': closeModal(); break;
    case 'go-train': view='train'; render(); break;
    case 'start-plan': startSession(live(S.plans).find(p=>p.id===btn.dataset.id)); break;
    case 'start-empty': startSession(null); break;
    case 'new-plan': planEditor(null); break;
    case 'edit-plan': planEditor(btn.dataset.id); break;
    case 'del-plan': {
      const p = S.plans.find(x=>x.id===btn.dataset.id);
      if(p && confirm('Delete this plan? Logged sessions stay in your history.')){ drop(p); render(); }
      break;
    }
    case 'tpl': {
      const name = btn.dataset.name;
      const items = TEMPLATES[name].map(([n,sets,reps,rest])=>{
        const ex = live(S.exercises).find(e=>e.name===n);
        return ex ? { exId:ex.id, sets, reps, rest } : null;
      }).filter(Boolean);
      const plan = { id:uid(), name, items };
      S.plans.push(plan); commit(plan); render(); toast(name+' added.');
      break;
    }
    case 'new-ex': newExercise(); break;
    case 'del-ex': {
      const e = S.exercises.find(x=>x.id===btn.dataset.id);
      if(e && confirm('Delete this exercise?')){ drop(e); render(); }
      break;
    }
    case 'add-ex': pickExercise(exId=>{
        S.active.entries.push({ exId, target:'', rest:S.settings.restDefault,
          sets:[{kg:'',reps:'',done:false},{kg:'',reps:'',done:false},{kg:'',reps:'',done:false}] });
        saveLocal(); render();
      }); break;
    case 'rm-set-last': {
      const lastSet = entry.sets[entry.sets.length-1];
      if(lastSet.done && (num(lastSet.kg) || num(lastSet.reps)) && !confirm('That set has numbers in it. Remove anyway?')) break;
      entry.sets.pop(); saveLocal(); render(); break;
    }
    case 'edit-session': editSession(btn.dataset.id); break;
    case 'del-session': deleteSession(btn.dataset.id); closeModal(); break;
    case 'all-sessions': historySheet(); break;
    case 'reopen': closeModal(); resumeSession(btn.dataset.id); break;
    case 'add-set': {
      const prev = entry.sets[entry.sets.length-1];
      entry.sets.push({ kg:prev?prev.kg:'', reps:prev?prev.reps:'', done:false }); saveLocal(); render(); break;
    }
    case 'repeat': {
      const last = lastEntry(entry.exId);
      entry.sets = doneSets(last.entry).map(s=>({ kg:s.kg, reps:s.reps, done:false }));
      saveLocal(); render(); break;
    }
    case 'inc': case 'dec': {
      nudge(entry, +rowEl.dataset.set, btn.dataset.f, act==='inc' ? 1 : -1);
      const s = entry.sets[+rowEl.dataset.set];
      rowEl.querySelector(`.num[data-f="${btn.dataset.f}"]`).value = s[btn.dataset.f];
      const vol = block.querySelector('[data-exvol]');
      if(vol) vol.textContent = fmtKg(entryVolume(entry))+' '+S.settings.unit;
      break;
    }
    case 'tick': {
      const s = entry.sets[+rowEl.dataset.set];
      if(!s.done && (!num(s.kg) || !num(s.reps))){
        const ph = rowEl.querySelectorAll('.num');
        if(!num(s.kg) && ph[0].placeholder !== '0') s.kg = ph[0].placeholder;
        if(!num(s.reps) && ph[1].placeholder !== '0') s.reps = ph[1].placeholder;
      }
      if(!num(s.kg) || !num(s.reps)){ toast('Set a weight and reps first.'); break; }
      s.done = !s.done;
      saveLocal();
      Sound.arm(); Wake.on();
      if(s.done && S.settings.autoRest){
        const ex = exById(entry.exId);
        Rest.start(entry.rest || S.settings.restDefault, ex ? ex.name : 'Rest');
      }
      render();
      break;
    }
    case 'rest-now': {
      const ex = exById(entry.exId);
      Rest.start(entry.rest || S.settings.restDefault, ex ? ex.name : 'Rest');
      break;
    }
    case 'opts': exerciseOptions(entry); break;
    case 'rest-plus': Rest.bump(30); break;
    case 'rest-minus': Rest.bump(-30); break;
    case 'rest-skip': Rest.stop(); break;
    case 'discard':
      if(confirm('Discard this session? Nothing will be saved.')){
        S.active=null; Rest.stop(); Wake.off(); Sound.release(); saveLocal(); render();
      }
      break;
    case 'finish': finishSession(); break;
    case 'sync-now': Sync.run().then(()=>toast('Synced.')); break;
    case 'signout': if(confirm('Sign out? Your data stays on the server.')) Sync.signOut(); break;
    case 'gh-setup': backupSheet(); break;
    case 'gh-push': Backup.push('manual backup').then(okd=>{ render(); toast(okd ? 'Backed up.' : 'Could not reach GitHub. It will retry.'); }); break;
    case 'gh-restore': restoreSheet(); break;
    case 'gh-off': if(confirm('Stop backing up to GitHub? The repo keeps everything already sent.')) Backup.disconnect(); break;
    case 'export': exportBackup(); break;
    case 'import': {
      const f = document.getElementById('importfile');
      f.onchange = ()=>{ if(f.files[0]) importBackup(f.files[0]); f.value=''; };
      f.click(); break;
    }
  }
});

/* hold a stepper to run it */
let holdT = null, holdI = null;
document.addEventListener('pointerdown', ev=>{
  const b = ev.target.closest('.stepper button');
  if(!b) return;
  clearTimeout(holdT); clearInterval(holdI);
  holdT = setTimeout(()=>{ holdI = setInterval(()=>b.click(), 110); }, 450);
});
['pointerup','pointercancel','pointerleave'].forEach(e=>
  document.addEventListener(e, ()=>{ clearTimeout(holdT); clearInterval(holdI); }));

/* typing in a set field patches in place so focus is never lost */
document.addEventListener('input', ev=>{
  const el = ev.target;
  if(el.id==='restdef'){ S.settings.restDefault = +el.value; commit(S.settings); return; }
  if(!el.classList.contains('num') || !el.closest('[data-set]') || !S.active) return;
  const block = el.closest('[data-ex]'); if(!block) return;
  const entry = S.active.entries.find(e=>e.exId===block.dataset.ex);
  const s = entry.sets[+el.closest('[data-set]').dataset.set];
  s[el.dataset.f] = el.value.replace(/[^0-9.]/g,'');
  const vol = block.querySelector('[data-exvol]');
  if(vol) vol.textContent = fmtKg(entryVolume(entry))+' '+S.settings.unit;
  saveLocal();
});

document.addEventListener('change', ev=>{
  if(ev.target.id==='exsel'){ progressEx = ev.target.value; render(); }
  if(ev.target.id==='autorest'){ S.settings.autoRest = ev.target.checked; commit(S.settings); }
  if(ev.target.id==='sound'){ S.settings.sound = ev.target.checked; if(ev.target.checked) Sound.arm(); else Sound.release(); commit(S.settings); }
  if(ev.target.id==='ghauto'){ Backup.cfg.auto = ev.target.checked; Backup.save(); }
  if(ev.target.id==='awake'){ S.settings.keepAwake = ev.target.checked; commit(S.settings); ev.target.checked ? Wake.on() : Wake.off(); }
});

document.addEventListener('keydown', ev=>{
  if(ev.key==='Escape') closeModal();
  if(ev.key==='Enter' && ev.target.id==='pass'){ document.getElementById('dologin').click(); return; }
  if(ev.key!=='Enter' || !ev.target.classList.contains('num')) return;
  ev.preventDefault(); ev.target.blur();
});

window.addEventListener('resize', ()=>{ if(view==='progress') paintChart(); });

/* ======================================================================
   backup files
   ====================================================================== */
function exportBackup(){
  const blob = new Blob([JSON.stringify(S,null,2)],{type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `plate-ledger-${new Date().toISOString().slice(0,10)}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
}
function importBackup(file){
  const fr = new FileReader();
  fr.onload = ()=>{
    try{
      const data = JSON.parse(fr.result);
      if(!data.exercises || !data.sessions) throw new Error('shape');
      if(!confirm('Replace everything on this device with the backup?')) return;
      S = Object.assign({ exercises:[], plans:[], sessions:[], settings:S.settings, active:null, lastSync:0 }, data);
      S.active = null;
      [...S.exercises,...S.plans,...S.sessions].forEach(r=>dirty.add(r.id));
      saveLocal(); render(); Sync.run();
      toast(`Restored ${live(S.sessions).length} sessions.`);
    }catch(e){ toast('That file is not a Plate Ledger backup.'); }
  };
  fr.readAsText(file);
}

/* ======================================================================
   boot
   ====================================================================== */
function seedIfEmpty(){
  if(live(S.exercises).length) return;
  SEED.forEach(([name,group,step])=>{
    const id = slug(name);
    if(S.exercises.some(e=>e.id===id)) return;
    S.exercises.push({ id, name, group, step, updated_at:Date.now() });
    dirty.add(id);
  });
  saveLocal();
}

(async function init(){
  try{
    const cached = JSON.parse(LOCAL.getItem(LKEY) || 'null');
    if(cached) S = Object.assign(S, cached, { settings: Object.assign(S.settings, cached.settings||{}) });
  }catch(e){}

  await Sync.probe();
  if(Sync.mode === 'server'){
    // Pull before seeding: seeding first is how a second device ends up
    // with the movement list twice.
    if(Sync.token){ await Sync.run(); seedIfEmpty(); }
  }else{
    seedIfEmpty();
  }

  Backup.init();
  Rest.restore();
  render();
  if(S.active) Wake.on();

  if(dirty.size) Sync.schedule();
  setInterval(()=>{ if(dirty.size) Sync.run(); }, 45000);

  const secure = location.protocol === 'https:' || location.hostname === 'localhost';
  if('serviceWorker' in navigator && secure){
    try{ navigator.serviceWorker.register('sw.js'); }catch(e){}
  }
})();
</script>
